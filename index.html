<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Study Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f5f7fa;
    color: #222;
    font-family: Arial, sans-serif;
}

.app {
    max-width: 800px;
    margin: 0 auto;
}

h1 {
    margin: 0 0 25px;
    text-align: center;
    font-size: 28px;
}

.mode-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button,
select {
    min-height: 44px;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 7px;
    background: white;
    color: #222;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background: #eee;
}

.mode-buttons button {
    flex: 1;
    font-weight: 600;
}

.mode-buttons button.active {
    background: #333;
    color: white;
    border-color: #333;
}

textarea {
    width: 100%;
    min-height: 220px;
    padding: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    resize: vertical;
    font-size: 16px;
    line-height: 1.6;
    font-family: Arial, sans-serif;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 15px 0;
}

.controls select {
    flex: 1 1 180px;
    min-width: 0;
}

.settings-controls {
    gap: 8px;
}

.settings-controls select {
    flex: 1 1 150px;
    min-height: 40px;
    padding: 8px 10px;
    font-size: 14px;
    background: #fafafa;
}

.controls button {
    flex: 1 1 auto;
}

.clear-button {
    margin-left: auto;
    color: #b22;
    border-color: #c44;
}

.clear-button:hover {
    background: #fee;
}

.status {
    min-height: 24px;
    margin: 10px 0;
    color: #666;
    font-size: 14px;
}

.sentences {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.sentence {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    transition: background 0.2s, border-color 0.2s;
}

.sentence.speaking {
    background: #dff6ff;
    border-color: #87ceeb;
}

.sentence-text {
    flex: 1;
    min-width: 0;
    font-size: 18px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    cursor: pointer;
}

.listen-button {
    flex-shrink: 0;
    white-space: nowrap;
}

.empty {
    padding: 30px;
    text-align: center;
    color: #888;
    background: white;
    border-radius: 8px;
}

@media (max-width: 600px) {
    body {
        padding: 20px 10px;
    }

    h1 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .mode-buttons {
        gap: 8px;
    }

    .mode-buttons button {
        min-height: 48px;
        padding: 10px 8px;
        font-size: 14px;
    }

    textarea {
        min-height: 200px;
        font-size: 16px;
    }

    .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .settings-controls {
        grid-template-columns: 1fr 1fr 1fr;
    }

    .controls select {
        width: 100%;
        min-height: 44px;
        font-size: 14px;
    }

    .settings-controls select {
        min-height: 42px;
        padding: 8px 6px;
        font-size: 13px;
    }

    .controls button {
        width: 100%;
        min-height: 48px;
        padding: 10px 8px;
        font-size: 14px;
    }

    .clear-button {
        margin-left: 0;
    }

    .sentence {
        align-items: center;
        padding: 12px;
    }

    .sentence-text {
        font-size: 18px;
    }

    .listen-button {
        min-height: 44px;
        padding: 9px 12px;
    }
}

@media (max-width: 380px) {
    .settings-controls {
        grid-template-columns: 1fr;
    }

    .sentence {
        align-items: flex-start;
        flex-direction: column;
    }

    .listen-button {
        width: 100%;
    }
}
</style>
</head>

<body>
<div class="app">

    <h1>Voice Study Tool</h1>

    <div class="mode-buttons">
        <button id="normalModeButton" class="active">Normal Mode</button>
        <button id="lyricsModeButton">Lyrics Mode</button>
    </div>

    <textarea
        id="textInput"
        placeholder="Enter your text here..."
    ></textarea>

    <div class="controls settings-controls">
        <select id="languageSelect">
            <option value="de-DE">German</option>
            <option value="es-US">Spanish (Latin America)</option>
            <option value="es-ES">Spanish (Spain)</option>
            <option value="en-US">English (US)</option>
            <option value="en-GB">English (UK)</option>
            <option value="fr-FR">French</option>
            <option value="sv-SE">Swedish</option>
        </select>

        <select id="voiceSelect">
            <option value="">Default voice</option>
        </select>

        <select id="speedSelect">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2x</option>
        </select>
    </div>

    <div class="controls">
        <button id="readAllButton">🔊Read All</button>
        <button id="pauseButton">⏸ Pause</button>
        <button id="resumeButton">▶ Resume</button>
        <button id="stopButton">⏹ Stop</button>
        <button id="clearButton" class="clear-button">Clear Sentences</button>
    </div>

    <div id="status" class="status"></div>

    <div id="sentences" class="sentences">
        <div class="empty">No sentences yet.</div>
    </div>

</div>

<script>
const STORAGE_KEY = "ttsStudyToolData";

const textInput = document.getElementById("textInput");
const languageSelect = document.getElementById("languageSelect");
const voiceSelect = document.getElementById("voiceSelect");
const speedSelect = document.getElementById("speedSelect");

const normalModeButton = document.getElementById("normalModeButton");
const lyricsModeButton = document.getElementById("lyricsModeButton");

const readAllButton = document.getElementById("readAllButton");
const pauseButton = document.getElementById("pauseButton");
const resumeButton = document.getElementById("resumeButton");
const stopButton = document.getElementById("stopButton");
const clearButton = document.getElementById("clearButton");

const status = document.getElementById("status");
const sentencesContainer = document.getElementById("sentences");

let mode = "normal";
let voices = [];
let sentences = [];
let currentSpeakingIndex = -1;
let readingAll = false;
let readAllIndex = 0;
let individualReading = false;

function saveData() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            text: textInput.value,
            language: languageSelect.value,
            speed: speedSelect.value,
            mode: mode
        })
    );
}

function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (!saved) {
        updateSentences();
        return;
    }

    try {
        const data = JSON.parse(saved);

        textInput.value = data.text || "";

        if (data.language) {
            languageSelect.value = data.language;
        }

        if (data.speed) {
            speedSelect.value = data.speed;
        }

        if (data.mode === "lyrics") {
            mode = "lyrics";
            normalModeButton.classList.remove("active");
            lyricsModeButton.classList.add("active");
        }

        updateSentences();
    } catch {
        updateSentences();
    }
}

function splitNormalText(text) {
    const normalized = text
        .replace(/\r?\n/g, " ")
        .replace(/\s+/g, " ")
        .trim();

    if (!normalized) {
        return [];
    }

    const raw = normalized
        .split(/(?<=[.!?])\s+/)
        .map(sentence => sentence.trim())
        .filter(Boolean);

    const result = [];

    for (const sentence of raw) {
        const wordCount = sentence
            .split(/\s+/)
            .filter(Boolean)
            .length;

        if (wordCount < 3 && result.length > 0) {
            result[result.length - 1] += " " + sentence;
        } else {
            result.push(sentence);
        }
    }

    if (
        result.length > 1 &&
        result[0].split(/\s+/).filter(Boolean).length < 3
    ) {
        result[1] = result[0] + " " + result[1];
        result.shift();
    }

    return result;
}

function splitLyricsText(text) {
    return text
        .split(/\r?\n/)
        .map(line => line.replace(/\([^)]*\)/g, "").trim())
        .map(line => line.replace(/\s+/g, " ").trim())
        .filter(Boolean);
}

function updateSentences() {
    speechSynthesis.cancel();

    currentSpeakingIndex = -1;
    readingAll = false;
    readAllIndex = 0;
    individualReading = false;

    if (mode === "normal") {
        sentences = splitNormalText(textInput.value);
    } else {
        sentences = splitLyricsText(textInput.value);
    }

    renderSentences();
    saveData();
}

function scrollToSpeakingSentence() {
    if (currentSpeakingIndex < 0) {
        return;
    }

    const item = sentencesContainer.querySelector(
        `[data-index="${currentSpeakingIndex}"]`
    );

    if (!item) {
        return;
    }

    item.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function renderSentences() {
    sentencesContainer.innerHTML = "";

    if (sentences.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No sentences yet.";
        sentencesContainer.appendChild(empty);
        return;
    }

    sentences.forEach((sentence, index) => {
        const item = document.createElement("div");
        item.className = "sentence";
        item.dataset.index = index;

        if (index === currentSpeakingIndex) {
            item.classList.add("speaking");
        }

        const text = document.createElement("div");
        text.className = "sentence-text";
        text.textContent = sentence;
        text.addEventListener("click", () => {
            speakSentence(index);
        });

        const button = document.createElement("button");
        button.className = "listen-button";
        button.textContent = "➡️";
        button.addEventListener("click", () => {
            readFromSentence(index);
        });

        item.appendChild(text);
        item.appendChild(button);

        sentencesContainer.appendChild(item);
    });

    if (currentSpeakingIndex >= 0) {
        requestAnimationFrame(scrollToSpeakingSentence);
    }
}

function loadVoices() {
    voices = speechSynthesis.getVoices();

    const selectedLanguage = languageSelect.value;
    const previousVoice = voiceSelect.value;

    voiceSelect.innerHTML = "";

    const defaultOption = document.createElement("option");
    defaultOption.value = "";
    defaultOption.textContent = "Default voice";
    voiceSelect.appendChild(defaultOption);

    const matchingVoices = voices
        .filter(voice =>
            voice.lang.toLowerCase().startsWith(
                selectedLanguage.toLowerCase().split("-")[0]
            )
        )
        .sort((a, b) => {
            if (selectedLanguage === "es-US") {
                const aPreferred =
                    /mexico|latin|latino|es-us/i.test(a.name);
                const bPreferred =
                    /mexico|latin|latino|es-us/i.test(b.name);

                if (aPreferred && !bPreferred) return -1;
                if (!aPreferred && bPreferred) return 1;
            }

            return a.name.localeCompare(b.name);
        });

    matchingVoices.forEach(voice => {
        const option = document.createElement("option");
        option.value = voices.indexOf(voice);
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });

    if (
        previousVoice &&
        [...voiceSelect.options].some(
            option => option.value === previousVoice
        )
    ) {
        voiceSelect.value = previousVoice;
    }
}

function getSelectedVoice() {
    const index = voiceSelect.value;

    if (index === "") {
        return null;
    }

    return voices[Number(index)] || null;
}

function createUtterance(text) {
    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = languageSelect.value;
    utterance.rate = Number(speedSelect.value);

    const voice = getSelectedVoice();

    if (voice) {
        utterance.voice = voice;
        utterance.lang = voice.lang;
    }

    return utterance;
}

function speakSentence(index) {
    if (!sentences[index]) {
        return;
    }

    speechSynthesis.cancel();

    readingAll = false;
    individualReading = true;
    currentSpeakingIndex = index;

    renderSentences();

    const utterance = createUtterance(sentences[index]);

    utterance.onend = () => {
        individualReading = false;
        currentSpeakingIndex = -1;
        renderSentences();
    };

    utterance.onerror = () => {
        individualReading = false;
        currentSpeakingIndex = -1;
        renderSentences();
    };

    speechSynthesis.speak(utterance);
}

function readNext() {
    if (!readingAll || readAllIndex >= sentences.length) {
        readingAll = false;
        currentSpeakingIndex = -1;
        renderSentences();
        status.textContent = "";
        return;
    }

    const index = readAllIndex;

    currentSpeakingIndex = index;
    renderSentences();

    const utterance = createUtterance(sentences[index]);

    utterance.onend = () => {
        if (!readingAll) {
            return;
        }

        readAllIndex++;
        readNext();
    };

    utterance.onerror = () => {
        if (!readingAll) {
            return;
        }

        readAllIndex++;
        readNext();
    };

    speechSynthesis.speak(utterance);
}

function readFromSentence(index) {
    if (!sentences[index]) {
        return;
    }

    speechSynthesis.cancel();

    individualReading = false;
    readingAll = true;
    readAllIndex = index;

    status.textContent = "Reading all sentences...";
    readNext();
}

function readAll() {
    if (sentences.length === 0) {
        return;
    }

    speechSynthesis.cancel();

    individualReading = false;
    readingAll = true;
    readAllIndex = 0;

    status.textContent = "Reading all sentences...";
    readNext();
}

function pauseReading() {
    if (speechSynthesis.speaking) {
        speechSynthesis.pause();
        status.textContent = "Paused";
    }
}

function resumeReading() {
    if (speechSynthesis.paused) {
        speechSynthesis.resume();
        status.textContent = readingAll
            ? "Reading all sentences..."
            : "Reading";
    }
}

function stopReading() {
    readingAll = false;
    individualReading = false;
    speechSynthesis.cancel();

    currentSpeakingIndex = -1;
    renderSentences();

    status.textContent = "Stopped";
}

function clearSentences() {
    speechSynthesis.cancel();

    readingAll = false;
    individualReading = false;
    readAllIndex = 0;
    currentSpeakingIndex = -1;

    textInput.value = "";
    sentences = [];

    localStorage.removeItem(STORAGE_KEY);

    renderSentences();

    status.textContent = "Cleared";
    textInput.focus();
}

normalModeButton.addEventListener("click", () => {
    if (mode === "normal") {
        return;
    }

    mode = "normal";

    normalModeButton.classList.add("active");
    lyricsModeButton.classList.remove("active");

    updateSentences();
});

lyricsModeButton.addEventListener("click", () => {
    if (mode === "lyrics") {
        return;
    }

    mode = "lyrics";

    lyricsModeButton.classList.add("active");
    normalModeButton.classList.remove("active");

    updateSentences();
});

textInput.addEventListener("input", () => {
    updateSentences();
});

languageSelect.addEventListener("change", () => {
    loadVoices();
    saveData();
});

speedSelect.addEventListener("change", () => {
    saveData();
});

readAllButton.addEventListener("click", readAll);
pauseButton.addEventListener("click", pauseReading);
resumeButton.addEventListener("click", resumeReading);
stopButton.addEventListener("click", stopReading);
clearButton.addEventListener("click", clearSentences);

speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();
loadData();
</script>

</body>
</html>
